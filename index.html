<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>เหมียวเหมียว เรียวกัง</title>


<style>

body {
    margin: 0;
    font-family: sans-serif;

    background: linear-gradient(
        135deg,
        #f7f2eb,
        #ffe9d6
    );

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
}


/* การ์ด */

.card {
    width: 90%;
    max-width: 360px;

    background: white;

    padding: 35px;

    border-radius: 30px;

    text-align: center;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.12);
}


/* โลโก้ */

.logo {
    width: 130px;
    height: 130px;

    object-fit: cover;

    border-radius: 50%;

    margin-bottom: 15px;

    border: 4px solid #f2c38b;

    animation: float 3s ease-in-out infinite;
}


/* ชื่อ */

h1 {
    color: #2c3e50;

    font-size: 26px;

    margin-bottom: 5px;
}


/* คำอธิบาย */

p {
    color: #777;

    margin-bottom: 20px;
}


/* ปุ่มจอง */

.booking-btn {

    display: block;

    background: #e28a35;

    color: white;

    text-decoration: none;

    padding: 16px;

    border-radius: 16px;

    font-size: 20px;

    font-weight: bold;

    transition: 0.2s;
}

.booking-btn:hover {
    transform: scale(1.05);
    background: #cf7725;
}


/* =========================
   LINE + โทร
========================= */

.action-buttons {

    display: flex;

    gap: 10px;

    margin-top: 12px;
}


/* ปุ่ม LINE */

.line-btn {

    flex: 1;

    padding: 14px;

    border-radius: 14px;

    background: #06C755;

    color: white;

    text-decoration: none;

    font-size: 17px;

    font-weight: bold;

    text-align: center;

    box-sizing: border-box;

    transition: 0.2s;
}


/* ปุ่มโทร */

.phone-btn {

    flex: 1;

    padding: 14px;

    border-radius: 14px;

    background: #3498db;

    color: white;

    border: none;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    box-sizing: border-box;

    transition: 0.2s;
}


.line-btn:hover,
.phone-btn:hover {

    transform: scale(1.03);
}


/* =========================
   รายการเบอร์
========================= */

.phone-list {

    display: none;

    margin-top: 8px;
}


.phone-list.show {

    display: block;
}


/* ปุ่มเลือกเบอร์ */

.phone {

    display: block;

    margin-top: 8px;

    padding: 13px;

    border-radius: 12px;

    background: #eaf4fb;

    color: #2c3e50;

    text-decoration: none;

    font-weight: bold;

    transition: 0.2s;
}


.phone:hover {

    transform: scale(1.03);

    background: #d6ebf8;
}


/* โลโก้ลอย */

@keyframes float {

    0% {
        transform: translateY(0px);
    }

    50% {
        transform: translateY(-6px);
    }

    100% {
        transform: translateY(0px);
    }

}

</style>

</head>


<body>


<div class="card">


    <!-- โลโก้ -->

    <img
        src="https://i.ibb.co/7NT6sXVk/image.jpg"
        class="logo"
    >


    <!-- ชื่อ -->

    <h1>
        🐱 เหมียวเหมียว เรียวกัง 🐱
    </h1>


    <!-- คำอธิบาย -->

    <p>
        Cat Hotel • โรงแรมแมวพรีเมียม
    </p>


    <!-- ปุ่มจอง -->

    <a
        href="https://forms.gle/nBFQ6CDVnS5sTEjL7"
        target="_blank"
        class="booking-btn"
    >
        จองเลย 🐾
    </a>


    <!-- =========================
         มีแค่ 2 ปุ่ม
    ========================= -->

    <div class="action-buttons">


        <!-- LINE ปุ่มเดียว -->

        <a
            href="https://lin.ee/pKhmXa1"
            target="_blank"
            class="line-btn"
        >
            💬 LINE
        </a>


        <!-- โทร ปุ่มเดียว -->

        <button
            class="phone-btn"
            onclick="showPhones()"
        >
            📞 โทร
        </button>


    </div>


    <!-- =========================
         เลือกเบอร์
    ========================= -->

    <div
        class="phone-list"
        id="phoneList"
    >


        <!-- เบอร์ 1 -->

        <a
            href="tel:0982782764"
            class="phone"
        >
            📞 098-278-2764
        </a>


        <!-- เบอร์ 2 -->

        <a
            href="tel:0812345678"
            class="phone"
        >
            📞 081-234-5678
        </a>


    </div>


</div>


<script>

function showPhones() {

    const phoneList =
        document.getElementById("phoneList");

    phoneList.classList.toggle("show");

}

</script>


</body>

</html>
