<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cat Hotel</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background: linear-gradient(135deg, #f7f2eb, #ffe9d6);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:90%;
    max-width:360px;
    background:white;
    padding:35px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.12);
}

.logo{
    width:140px;
    height:140px;
    object-fit:cover;
    border-radius:50%;
    margin-bottom:15px;
    border:4px solid #f2c38b;
}

h1{
    color:#2c3e50;
    font-size:26px;
    margin-bottom:5px;
}

p{
    color:#777;
    margin-bottom:25px;
}

.btn{
    display:block;
    background:#e28a35;
    color:white;
    text-decoration:none;
    padding:16px;
    border-radius:16px;
    font-size:20px;
    font-weight:bold;
    transition:0.2s;
}

.btn:hover{
    transform:scale(1.03);
    background:#cf7725;
}
</style>
</head>

<body>

<div class="card">

    <!-- 🔴 ใส่โลโก้ตรงนี้ -->
    <img src="https://i.ibb.co/7NT6sXVk/image.jpg" class="logo">

    <h1>🐱 เหมียวเหมียว เรียวกัง 🐱</h1>

    <p>Cat Hotel • โรงแรมแมว</p>

    <!-- 🔵 ปุ่มจอง -->
    <a href="https://forms.gle/nBFQ6CDVnS5sTEjL7"
       target="_blank"
       class="btn">
       จองเลย 🐾
    </a>

</div>

</body>
</html>
