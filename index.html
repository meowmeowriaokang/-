<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>เหมียวเหมียว เรียวกัง</title>

<style>

/* =========================
   พื้นหลัง
========================= */

body{
    margin:0;
    font-family:sans-serif;
    background:linear-gradient(135deg,#f7f2eb,#ffe9d6);

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
}


/* =========================
   การ์ดหลัก
========================= */

.card{
    width:90%;
    max-width:360px;

    background:white;

    padding:35px;

    border-radius:30px;

    text-align:center;

    box-shadow:0 10px 30px rgba(0,0,0,0.12);
}


/* =========================
   โลโก้
========================= */

.logo{
    width:130px;
    height:130px;

    object-fit:cover;

    border-radius:50%;

    margin-bottom:15px;

    border:4px solid #f2c38b;

    animation:float 3s ease-in-out infinite;
}


/* =========================
   ชื่อโรงแรม
========================= */

h1{
    color:#2c3e50;

    font-size:26px;

    margin-bottom:5px;
}


/* =========================
   คำอธิบาย
========================= */

p{
    color:#777;

    margin-bottom:20px;
}


/* =========================
   ปุ่มจอง
========================= */

.btn{
    display:block;

    background:#e28a35;

    color:white;

    text-decoration:none;

    padding:16px;

    border-radius:16px;

    font-size:20px;

    font-weight:bold;

    transition:0.2s;
}

.btn:hover{
    transform:scale(1.05);

    background:#cf7725;
}


/* =========================
   ส่วนติดต่อ
========================= */

.contact{
    margin-top:15px;
}


/* ปุ่มติดต่อหลัก */

.contact-main{

    width:100%;

    padding:14px;

    border:none;

    border-radius:14px;

    background:#3498db;

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:0.2s;
}

.contact-main:hover{

    transform:scale(1.03);

    background:#2980b9;
}


/* =========================
   รายการติดต่อ
========================= */

.contact-list{

    display:none;

    margin-top:10px;
}


/* เมื่อกดเปิด */

.contact-list.show{

    display:block;
}


/* =========================
   ปุ่ม LINE / โทร
========================= */

.contact-item{

    display:block;

    margin-top:8px;

    padding:13px;

    border-radius:12px;

    text-decoration:none;

    color:white;

    font-weight:bold;

    transition:0.2s;
}


/* LINE */

.line{

    background:#06C755;
}


/* โทร */

.phone{

    background:#3498db;
}


.contact-item:hover{

    transform:scale(1.03);

    opacity:0.9;
}


/* =========================
   Animation โลโก้
========================= */

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-6px);
    }

    100%{
        transform:translateY(0px);
    }
}

</style>

</head>


<body>


<!-- =========================
     การ์ดหลัก
========================= -->

<div class="card">


    <!-- โลโก้ -->

    <img
        src="https://i.ibb.co/7NT6sXVk/image.jpg"
        class="logo"
    >


    <!-- ชื่อ -->

    <h1>
        🐱 เหมียวเหมียว เรียวกัง 🐱
    </h1>


    <!-- คำอธิบาย -->

    <p>
        Cat Hotel • โรงแรมแมวพรีเมียม
    </p>


    <!-- =========================
         ปุ่มจอง
    ========================= -->

    <a
        href="https://forms.gle/nBFQ6CDVnS5sTEjL7"
        target="_blank"
        class="btn"
    >
        จองเลย 🐾
    </a>


    <!-- =========================
         ติดต่อ
    ========================= -->

    <div class="contact">


        <!-- ปุ่มเดียว -->

        <button
            class="contact-main"
            onclick="showContacts()"
        >
            📞 ติดต่อเรา
        </button>


        <!-- เมนูที่ซ่อนอยู่ -->

        <div
            class="contact-list"
            id="contactList"
        >


            <!-- LINE -->

            <a
                href="https://line.me/ti/p/~0982782764"
                target="_blank"
                class="contact-item line"
            >
                💬 LINE
            </a>


            <!-- เบอร์โทร 1 -->

            <a
                href="tel:0982782764"
                class="contact-item phone"
            >
                📞 098-278-2764
            </a>


            <!-- เบอร์โทร 2 -->

            <a
                href="tel:0812345678"
                class="contact-item phone"
            >
                📞 081-234-5678
            </a>


        </div>

    </div>


</div>


<!-- =========================
     JavaScript
========================= -->

<script>

function showContacts(){

    const contactList =
        document.getElementById("contactList");

    contactList.classList.toggle("show");

}

</script>


</body>
</html>
